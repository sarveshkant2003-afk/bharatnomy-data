<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharatnomy Variable Map</title>
<meta name="description" content="Mind map of every variable in Bharatnomy's datasets, by lens and sub-theme, with search.">
<style>
:root {
  color-scheme: light;
  --bg: #fbf8f1; --surface: #ffffff; --text: #241f19; --muted: #6e6658; --faint: #9a9182;
  --border: #e9e2d3; --border-strong: #d9cfbb;
  --accent: #1d6b52; --accent-soft: #e5f1eb; --mark: #fde9a6;
  --shadow: 0 1px 2px rgba(60,45,20,.06), 0 6px 20px rgba(60,45,20,.08);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: linear-gradient(180deg, #fffdf8 70%, rgba(251,248,241,0)); }
.bar h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
.search { position: relative; flex: 1 1 320px; max-width: 560px; }
.search input { width: 100%; font: inherit; font-size: 15px; padding: 10px 14px 10px 38px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.count { color: var(--muted); font-size: 13px; white-space: nowrap; }
.tools { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.tools button, .tools a { font: inherit; font-size: 13px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.tools button:hover, .tools a:hover { color: var(--accent); border-color: var(--border-strong); text-decoration: none; }

#map { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; }
#map:active { cursor: grabbing; }
.link { fill: none; stroke-width: 1.6; stroke-opacity: .55; }
.node { cursor: pointer; }
.node text { font-size: 13px; fill: var(--text); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.node .n { fill: var(--faint); font-size: 11.5px; }
.node.var text { font-size: 12.5px; }
.node.var .unit { fill: var(--faint); font-size: 11px; }
.node.hit text.label { font-weight: 600; }
.node.hit rect.hl { fill: var(--mark); }
.node.sel text.label { fill: var(--accent); font-weight: 700; }
.node.empty text { fill: var(--faint); font-style: italic; }
.node:hover text.label { text-decoration: underline; }
.pill text { font-weight: 650; fill: #fff; stroke: none; font-size: 14px; }
.root text { font-weight: 750; font-size: 17px; fill: #fff; stroke: none; }

.panel { position: fixed; right: 16px; top: 70px; z-index: 6; width: 360px; max-width: calc(100vw - 32px); max-height: calc(100vh - 90px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; display: none; }
.panel.open { display: block; }
.panel h2 { font-size: 16px; margin: 0 26px 4px 0; line-height: 1.35; }
.panel .crumb { font-size: 12px; color: var(--faint); margin-bottom: 10px; }
.panel dl { display: grid; grid-template-columns: 110px 1fr; gap: 5px 10px; margin: 10px 0; font-size: 13px; }
.panel dt { color: var(--faint); }
.panel dd { margin: 0; word-break: break-word; }
.panel .close { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 22px; color: var(--faint); cursor: pointer; line-height: 1; }
.panel .close:hover { color: var(--text); }
.panel .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.panel .links a { font-size: 13px; border: 1px solid var(--border-strong); border-radius: 8px; padding: 5px 10px; color: var(--text); }
.panel .links a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tag { font-size: 11.5px; border-radius: 5px; padding: 1px 7px; background: #f5efe2; }
.tag.derived { background: #fdf0d9; color: #7a5410; }
.tag.raw { background: var(--accent-soft); color: #15563f; }
.hint { position: fixed; left: 16px; bottom: 12px; z-index: 5; color: var(--faint); font-size: 12.5px; background: rgba(251,248,241,.85); padding: 4px 8px; border-radius: 6px; }
@media (max-width: 700px) {
  .bar h1 { display: none; }
  .tools { margin-left: 0; }
  .panel { top: auto; bottom: 12px; right: 12px; left: 12px; width: auto; max-height: 55vh; }
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="bar">
  <h1>Bharatnomy Variable Map</h1>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search variables: heat wave, rainfall, cooking fuel, wind…" autocomplete="off" aria-label="Search variables">
  </label>
  <span class="count" id="count"></span>
  <div class="tools">
    <button id="expand" type="button">Open sub-themes</button>
    <button id="collapse" type="button">Close all</button>
    <button id="fit" type="button">Fit to screen</button>
    <a href="index.html">Dataset search</a>
  </div>
</div>
<svg id="map" role="img" aria-label="Mind map of lenses, sub-themes, datasets and variables"></svg>
<div class="panel" id="panel" role="dialog" aria-label="Variable details"></div>
<div class="hint">Click a branch to open it · drag to move · scroll to zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="registry.js?v=1"></script>
<script>
const REPO = "sarveshkant2003-afk/bharatnomy-data", BRANCH = "main";
const R = window.REGISTRY || { lenses: [], datasets: {}, variables: [] };
const COLORS = { CAR: "#1d6b52", EPM: "#b5651d", MAC: "#3d5a99", EQM: "#8a3e7a", COM: "#7a7a1d" };
const RIGHT = new Set(["CAR", "EPM"]);           // lenses drawn to the right of the centre; the rest go left
const LEVELS = { IN: "All India", STATE: "State", DIST: "District", SDT: "Sub-district", CITY: "City", VIL: "Village" };
const DY = 30, DX = [0, 110, 350, 330, 390];    // row height; gap from the parent column, by depth (lens, sub-theme, dataset, variable)
const SEARCH_OPEN_ALL = 150;                    // with this many matches or fewer, search opens every branch down to variables

const lensOf = {}, subName = {};
R.lenses.forEach(l => l.sub_themes.forEach(s => { lensOf[s.id] = l.id; subName[s.id] = s.name; }));
const VARS = R.variables.map(v => ({ ...v, _t: [v.name, v.column, v.unit, subName[v.sub_theme_id]].join(" ").toLowerCase() }));

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const dsTitle = d => (R.datasets[d] || {}).title || d;

let query = "", open = new Set(["root"]), selected = null;

function terms() { return query.toLowerCase().split(/\s+/).filter(Boolean); }
function matching() { const t = terms(); return t.length ? VARS.filter(v => t.every(w => v._t.includes(w))) : VARS; }

// Tree: root -> lens -> sub-theme -> dataset -> variable
function buildTree(vars) {
  const searching = terms().length > 0;
  const root = { key: "root", kind: "root", name: "Bharatnomy", children: [] };
  for (const l of R.lenses) {
    const lv = vars.filter(v => v.lens_id === l.id);
    if (searching && !lv.length) continue;
    const lens = { key: "L:" + l.id, kind: "lens", lens: l.id, name: l.name, count: lv.length, children: [] };
    for (const s of l.sub_themes) {
      const sv = lv.filter(v => v.sub_theme_id === s.id);
      if (searching && !sv.length) continue;
      const sub = { key: "S:" + s.id, kind: "sub", lens: l.id, name: s.name, count: sv.length, children: [] };
      const byDs = d3.group(sv, v => v.dataset);
      for (const [ds, dv] of [...byDs].sort((a, b) => dsTitle(a[0]).localeCompare(dsTitle(b[0])))) {
        sub.children.push({ key: "D:" + s.id + ":" + ds, kind: "ds", lens: l.id, name: dsTitle(ds), dataset: ds, count: dv.length,
          children: dv.map(v => ({ key: "V:" + v.variable_id, kind: "var", lens: l.id, name: v.name, v })) });
      }
      lens.children.push(sub);
    }
    root.children.push(lens);
  }
  return root;
}

function setOpenForSearch(tree, n) {
  open = new Set(["root"]);
  const depth = n <= SEARCH_OPEN_ALL ? 3 : n <= 1200 ? 2 : 1;   // how deep to open: datasets (3) show variables
  (function walk(node, d) { if (d <= depth && node.children && node.children.length) { open.add(node.key); node.children.forEach(c => walk(c, d + 1)); } })(tree, 0);
}

// Keep only the open part of the tree
function visible(node) {
  const n = { ...node };
  n._hasKids = !!(node.children && node.children.length);
  n.children = open.has(node.key) && node.children ? node.children.map(visible) : null;
  return n;
}

const svg = d3.select("#map");
const g = svg.append("g");
const gLinks = g.append("g"), gNodes = g.append("g");
const zoom = d3.zoom().scaleExtent([0.15, 2.5]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom).on("dblclick.zoom", null);

function layoutSide(rootData, lensIds, dir) {
  const side = { ...rootData, children: (rootData.children || []).filter(c => lensIds.has(c.lens)) };
  const h = d3.hierarchy(side, d => d.children);
  d3.tree().nodeSize([DY, 1]).separation((a, b) => (a.parent === b.parent ? 1 : 1.25))(h);
  h.each(d => { let x = 0; for (let i = 1; i <= d.depth; i++) x += DX[Math.min(i, DX.length - 1)]; d.px = dir * x; d.py = d.x; d.dir = dir; });
  return h;
}

let lastTree = null;
function render(fit) {
  const vars = matching();
  const tree = buildTree(vars);
  lastTree = tree;
  const vis = visible(tree);
  const rightIds = new Set(R.lenses.map(l => l.id).filter(id => RIGHT.has(id)));
  const leftIds = new Set(R.lenses.map(l => l.id).filter(id => !RIGHT.has(id)));
  const hr = layoutSide(vis, rightIds, 1), hl = layoutSide(vis, leftIds, -1);
  const nodes = [], links = [];
  [hr, hl].forEach((h, i) => h.descendants().forEach(d => { if (d.depth === 0 && i === 1) return; nodes.push(d); if (d.parent) links.push(d); }));

  const t = svg.transition().duration(350);
  const color = d => d.data.kind === "root" ? "#241f19" : COLORS[d.data.lens] || "#666";
  const curve = d => {
    const s = d.parent.depth === 0 ? { x: 0, y: 0 } : { x: d.parent.px + d.dir * labelWidth(d.parent), y: d.parent.py };
    const sx = d.parent.depth === 0 ? d.dir * 60 : s.x, tx = d.px - d.dir * 6;
    const mx = (sx + tx) / 2;
    return `M${sx},${s.y} C${mx},${s.y} ${mx},${d.py} ${tx},${d.py}`;
  };
  gLinks.selectAll("path").data(links, d => d.data.key).join(
    enter => enter.append("path").attr("class", "link").attr("stroke", color).attr("d", curve).attr("opacity", 0).call(e => e.transition(t).attr("opacity", 1)),
    update => update.call(u => u.transition(t).attr("d", curve).attr("stroke", color)),
    exit => exit.remove());

  const tq = terms();
  const node = gNodes.selectAll("g.node").data(nodes, d => d.data.key).join(
    enter => {
      const e = enter.append("g").attr("transform", d => `translate(${d.px},${d.py})`).attr("opacity", 0);
      e.call(drawNode);
      e.on("click", (ev, d) => onClick(d));
      e.transition(t).attr("opacity", 1);
      return e;
    },
    update => { update.selectAll("*").remove(); update.call(drawNode); update.transition(t).attr("transform", d => `translate(${d.px},${d.py})`); return update; },
    exit => exit.remove());

  document.getElementById("count").textContent = tq.length
    ? `${vars.length.toLocaleString()} of ${VARS.length.toLocaleString()} variables match`
    : `${VARS.length.toLocaleString()} variables · ${R.lenses.length} lenses`;
  if (fit) fitView(nodes);
}

// Width of a node's label (measured with the page font), so pills fit their text and links start after it
const FONT = getComputedStyle(document.body).fontFamily;
const ctx = document.createElement("canvas").getContext("2d");
function textW(text, size, weight) { ctx.font = `${weight || 400} ${size}px ${FONT}`; return ctx.measureText(text).width; }
function lensText(d) { return `${cut(d.data.name, 34)}  ${d.data.count}`; }
function labelWidth(d) {
  const k = d.data.kind;
  if (k === "root") return 60;
  if (k === "lens") return textW(lensText(d), 14, 650) + 30;
  if (k === "sub" || k === "ds") return 10 + textW(cut(d.data.name, k === "ds" ? 44 : 36), 13) + textW(`  ${d.data.count || "none yet"}`, 11.5) + 8;
  return 0;
}

function drawNode(sel) {
  sel.attr("class", d => {
    const c = ["node", d.data.kind];
    if (d.data.kind === "var" && terms().length) c.push("hit");
    if (d.data.kind === "var" && selected === d.data.key) c.push("sel");
    if (d.data.kind === "sub" && !d.data.count) c.push("empty");
    return c.join(" ");
  });
  sel.each(function (d) {
    const s = d3.select(this), k = d.data.kind, dir = d.dir || 1, col = k === "root" ? "#241f19" : COLORS[d.data.lens];
    if (k === "root") {
      s.classed("root", true);
      s.append("rect").attr("x", -60).attr("y", -20).attr("width", 120).attr("height", 40).attr("rx", 20).attr("fill", col);
      s.append("text").attr("text-anchor", "middle").attr("dy", "0.35em").text("Bharatnomy");
      return;
    }
    if (k === "lens") {
      const w = labelWidth(d);
      s.classed("pill", true);
      s.append("rect").attr("x", dir > 0 ? 0 : -w).attr("y", -15).attr("width", w).attr("height", 30).attr("rx", 15).attr("fill", col);
      s.append("text").attr("class", "label").attr("x", dir > 0 ? 15 : -15).attr("dy", "0.35em").attr("text-anchor", dir > 0 ? "start" : "end")
        .text(lensText(d));
      return;
    }
    const kids = d.data._hasKids, isOpen = open.has(d.data.key);
    s.append("circle").attr("r", k === "var" ? 3.5 : 5.5).attr("fill", kids && !isOpen ? col : "#fff").attr("stroke", col).attr("stroke-width", 2);
    const anchor = dir > 0 ? "start" : "end", x = dir > 0 ? 10 : -10;
    const label = k === "var" ? cut(d.data.name, 58) : cut(d.data.name, k === "ds" ? 44 : 36);
    const txt = s.append("text").attr("class", "label").attr("x", x).attr("dy", "0.35em").attr("text-anchor", anchor);
    txt.append("tspan").text(label);
    if (k !== "var") txt.append("tspan").attr("class", "n").text(`  ${d.data.count || "none yet"}`);
    if (k === "var" && d.data.v.unit) txt.append("tspan").attr("class", "unit").text(`  ${d.data.v.unit}`);
    s.append("title").text(k === "var" ? `${d.data.name}\n${d.data.v.column}` : d.data.name);
  });
}

function onClick(d) {
  const k = d.data.kind;
  if (k === "var") { selected = d.data.key; showPanel(d.data.v); render(false); return; }
  if (k === "root") return;
  if (!d.data._hasKids) return;
  open.has(d.data.key) ? closeBranch(d.data.key) : open.add(d.data.key);
  render(false);
  centerOn(d);
}
function closeBranch(key) { open.delete(key); [...open].forEach(k => { if (isDescendantKey(k, key)) open.delete(k); }); }
function isDescendantKey(k, key) {
  // keys encode the path: L:<lens>, S:<sub>, D:<sub>:<dataset>, V:<id>; close everything under a lens or sub-theme
  if (key.startsWith("L:")) { const lens = key.slice(2); return (k.startsWith("S:") && lensOf[k.slice(2)] === lens) || (k.startsWith("D:") && lensOf[k.split(":")[1]] === lens); }
  if (key.startsWith("S:")) return k.startsWith("D:" + key.slice(2) + ":");
  return false;
}

function showPanel(v) {
  const ds = R.datasets[v.dataset] || {};
  const lens = R.lenses.find(l => l.id === v.lens_id) || {};
  const p = document.getElementById("panel");
  const period = v.earliest_period ? (v.earliest_period === v.latest_period ? v.earliest_period : `${v.earliest_period} to ${v.latest_period}`) : "";
  p.innerHTML = `<button class="close" aria-label="Close">×</button>
    <h2>${esc(v.name)}</h2>
    <div class="crumb">${esc(lens.name)} › ${esc(subName[v.sub_theme_id])}</div>
    <dl>
      <dt>Column</dt><dd><code>${esc(v.column)}</code></dd>
      <dt>Unit</dt><dd>${esc(v.unit)}</dd>
      <dt>Geography</dt><dd>${esc(LEVELS[v.geo_level] || v.geo_level)}</dd>
      <dt>Period</dt><dd>${esc(period)} (${esc(v.frequency)})</dd>
      <dt>Type</dt><dd><span class="tag ${v.type}">${v.type === "derived" ? "derived (our calculation)" : "raw (as published)"}</span></dd>
      <dt>Dataset</dt><dd>${esc(ds.title || v.dataset)}<br><code>${esc(v.dataset)}</code></dd>
      ${ds.agency ? `<dt>Source</dt><dd>${esc(ds.agency)}</dd>` : ""}
    </dl>
    <div class="links">
      <a class="primary" href="https://github.com/${REPO}/tree/${BRANCH}/${encodeURIComponent(v.dataset)}">Open dataset</a>
      <a href="https://github.com/${REPO}/blob/${BRANCH}/${encodeURIComponent(v.dataset)}/${encodeURIComponent(v.dataset)}.csv">CSV</a>
      <a href="index.html#q=${encodeURIComponent(v.column)}">In dataset search</a>
    </div>`;
  p.classList.add("open");
  p.querySelector(".close").onclick = () => { p.classList.remove("open"); selected = null; render(false); };
}

function fitView(nodes) {
  const w = window.innerWidth, h = window.innerHeight;
  const xs = nodes.map(d => d.px), ys = nodes.map(d => d.py);
  const minX = Math.min(...xs) - 470, maxX = Math.max(...xs) + 470, minY = Math.min(...ys) - 40, maxY = Math.max(...ys) + 40;
  const k = Math.max(0.15, Math.min(1.1, w / (maxX - minX), (h - 80) / (maxY - minY)));
  const tx = w / 2 - k * (minX + maxX) / 2, ty = 40 + (h - 40) / 2 - k * (minY + maxY) / 2;
  svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
}
function centerOn(d) {
  const tr = d3.zoomTransform(svg.node());
  const x = window.innerWidth / 2 - tr.k * (d.px + d.dir * 150), y = window.innerHeight / 2 - tr.k * d.py;
  svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(x, y).scale(tr.k));
}

let timer;
document.getElementById("q").addEventListener("input", e => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    query = e.target.value.trim();
    history.replaceState(null, "", query ? "#q=" + encodeURIComponent(query) : location.pathname);
    if (query) { const n = matching().length; setOpenForSearch(buildTree(matching()), n); }
    else open = new Set(["root"]);
    render(true);
  }, 180);
});
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Escape") { e.target.value = ""; e.target.dispatchEvent(new Event("input")); } });
document.getElementById("expand").onclick = () => { open = new Set(["root", ...R.lenses.map(l => "L:" + l.id)]); render(true); };
document.getElementById("collapse").onclick = () => { open = new Set(["root"]); render(true); };
document.getElementById("fit").onclick = () => render(true);
window.addEventListener("resize", () => render(true));

const initial = decodeURIComponent((location.hash.match(/q=([^&]*)/) || [])[1] || "");
if (initial) { document.getElementById("q").value = initial; query = initial; setOpenForSearch(buildTree(matching()), matching().length); }
render(true);
</script>
</body>
</html>
